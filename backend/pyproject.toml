[tool.poetry]
name = "enterprise-rag-bedrock-backend"
version = "0.1.0"
description = "Backend API for Enterprise RAG Bedrock"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
boto3 = "^1.34.0"
langchain = "^0.3.0"
langchain-aws = "^0.2.0"
pydantic = "^2.9.0"
python-dotenv = "^1.0.1"
opensearch-py = "^2.7.1"
python-multipart = "^0.0.9"
spacy = "^3.7.0"
pymupdf = "^1.24.0"
python-docx = "^1.1.0"
cohere = "^5.11.0"
langchain-openai = "^0.2.0"
openai = "^1.54.0"
pyjwt = { extras = ["crypto"], version = "^2.9.0" }
email-validator = "^2.0.0"
langsmith = "^0.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"
moto = { extras = ["s3"], version = "^5.0.0" }

[tool.poetry.group.eval.dependencies]
ragas = "^0.2.0"
datasets = "^3.0.0"
requests = "^2.32.0"
# Pinned explicitly: ragas imports langchain_community.chat_models.vertexai
# unconditionally, which no longer exists in langchain-community >=0.4.
langchain-community = "^0.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
